name: Backend CI

on:
  push:
    branches: [ main, 'feat/**', 'fix/**', 'chore/**' ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'

jobs:
  build-and-test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vbl_test
          POSTGRES_PASSWORD: vbl_test_password
          POSTGRES_DB: vbl_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Secrets scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (no live API calls)
        env:
          NODE_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_NAME: vbl_test
          DATABASE_USER: vbl_test
          DATABASE_PASSWORD: vbl_test_password
          JWT_ACCESS_SECRET: ci-test-secret-not-real
          JWT_REFRESH_SECRET: ci-test-refresh-secret-not-real
          VERIFY_ET_API_KEY: PLACEHOLDER_NOT_REAL  # never call live in CI
          VERIFY_ET_WEBHOOK_SECRET: PLACEHOLDER_whsec_NOT_REAL
          PUBLIC_DOMAIN: localhost
        run: npm test -- --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/

      - name: Build
        run: npm run build
